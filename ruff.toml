# Exclude a variety of commonly ignored directories
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "__pypackages__",
    "__pycache__",
    "venv",
    "env",
]

line-length = 120

# Assume Python 3.9
target-version = "py39"

[lint.mccabe]
max-complexity = 7

[lint.pylint]
max-args = 6 # Maximum number of function arguments
max-branches = 10 # Maximum number of if/else branches
max-statements = 50 # Maximum number of statements in a function

[lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/test*.py" = ["PLR2004", "PLR0913", "PLR0915", "C901"]

[lint.isort]
known-first-party = []
force-single-line = false
relative-imports-order = "closest-to-furthest"
combine-as-imports = true

[lint]
preview = true # Enables experimental rules like E225
select = [
    "A", # flake8-builtins (redefinition of built-in names)
    "B", # flake8-bugbear - dangerous patterns (using `x == None` instead of `x is None`, etc.)
    "C", # flake8-comprehensions (unnecessary `list()`, unnecessary `dict()`)
    "E", # Errors from pycodestyle (PEP 8)
    "F", # Logical errors and potential bugs (unused imports, access to an undeclared variable, etc.)
    "I", # isort (import sorting)
    "W", # Warnings from pycodestyle (trailing whitespace, blank lines, etc.)
    "UP", # pyupgrade - code modernization (replacing `type(x) == int` with `isinstance(x, int)`, etc.)
    "PL", # Pylint rules (function complexity, global variables)
    "RET", # Checking returns
    "COM", # Commas
]
fixable = [
    "E",
    "F401",
    "I",
    "W",
    "COM",
]
unfixable = [
    "A",
    "B",
    "C",
    "PL",
    "RET",
    "UP",
]
ignore = [
    "RET501", # Ban on `return None` - conflict with mypy
    "RET504", # Redundant variable definition before return
    "B904", # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None`
    "UP031", # Use format specifiers instead of percent format
    "PLR6301", # Method could be a function, class method, or static method
    "PLC0415", # `import` should be at the top-level of a file
    "B008", # Do not perform function call in argument defaults
]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
