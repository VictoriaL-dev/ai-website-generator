services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio-dev
    ports:
      - "${S3__API_PORT}:9000"
      - "${S3__MINIO_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${S3__ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3__SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f ${S3__BASE_URL}/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-mc:
    image: quay.io/minio/mc:latest
    container_name: minio-mc-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set my-minio http://minio:${S3__API_PORT} ${S3__ACCESS_KEY} ${S3__SECRET_KEY};
      mc mb --ignore-existing my-minio/${S3__BUCKET_NAME};
      mc anonymous set public my-minio/${S3__BUCKET_NAME};
      "

volumes:
  minio_data:
